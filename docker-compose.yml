# ClaimOS development stack.
#   1. python scripts/dev_setup.py      (creates .env with generated secrets)
#   2. docker compose up -d --build
#   3. open http://localhost:8080
#
# Production deployment configuration is delivered in Phase 13. This file is for
# development and CI only: services run plain HTTP behind Nginx on localhost.

name: claimos

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"
  DATABASE_URL: postgresql+asyncpg://claimos_app:${CLAIMOS_APP_DB_PASSWORD:?run scripts/dev_setup.py}@postgres:5432/claimos
  MIGRATION_DATABASE_URL: postgresql+asyncpg://claimos_migrator:${POSTGRES_PASSWORD:?run scripts/dev_setup.py}@postgres:5432/claimos
  REDIS_URL: redis://:${REDIS_PASSWORD:?run scripts/dev_setup.py}@redis:6379/0
  STORAGE_PROVIDER: s3
  S3_ENDPOINT_URL: http://object-storage:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run scripts/dev_setup.py}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run scripts/dev_setup.py}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
  S3_BUCKET_DOCUMENTS: claimos-documents
  S3_BUCKET_REPORTS: claimos-reports
  AV_PROVIDER: ${AV_PROVIDER:-clamav}
  CLAMAV_HOST: clamav
  OCR_ENGINE: ${OCR_ENGINE:-tesseract}
  AI_PROVIDER: ${AI_PROVIDER:-openrouter}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openrouter/free}
  OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-}
  OPENROUTER_REASONING_MODEL: ${OPENROUTER_REASONING_MODEL:-}
  OPENROUTER_FAST_MODEL: ${OPENROUTER_FAST_MODEL:-}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-ClaimOS <no-reply@claimos.test>}
  SMS_PROVIDER: ${SMS_PROVIDER:-log}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: ../infrastructure/docker/backend.Dockerfile
  image: claimos-backend:dev
  environment: *backend-env
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: claimos_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: claimos
      CLAIMOS_APP_DB_PASSWORD: ${CLAIMOS_APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimos_migrator -d claimos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.6.8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (SeaweedFS, Apache-2.0). Any S3 provider works in production.
  object-storage:
    image: chrislusf/seaweedfs:4.50
    entrypoint: ["/bin/sh", "/opt/claimos/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # Enables SSE-S3 so objects are encrypted at rest (SeaweedFS reads WEED_* as config).
      WEED_S3_SSE_KEK: ${S3_SSE_KEK:?run scripts/dev_setup.py}
    volumes:
      - object-storage-data:/data
      - ./infrastructure/seaweedfs/entrypoint.sh:/opt/claimos/seaweedfs-entrypoint.sh:ro
    ports: ["127.0.0.1:${S3_HOST_PORT:-8333}:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Malware scanning for uploads (clamd INSTREAM on 3310). The first start downloads signatures.
  # Development SMTP server: catches every email; web UI and API on http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 600s
    restart: unless-stopped

  storage-init:
    <<: *backend-image
    command: ["python", "-m", "app.cli.storage_init"]
    depends_on:
      object-storage: { condition: service_healthy }
    restart: "no"

  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend-image
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Development runs one worker for all queues; production runs one pool per queue (ADR-004).
  worker:
    <<: *backend-image
    command: ["celery", "-A", "tasks.celery_app:celery_app", "worker", "-Q", "system,workflow,reports", "--concurrency=2", "--loglevel=INFO", "-n", "worker@%h"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app:celery_app inspect ping -d worker@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 5
    restart: unless-stopped

  # Schedules periodic tasks; today only workflow crash recovery (stale heartbeat -> resume from checkpoint).
  beat:
    <<: *backend-image
    command: ["celery", "-A", "tasks.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # Dedicated pool for OCR and document processing (ADR-004): CPU-heavy work never blocks other queues.
  worker-documents:
    <<: *backend-image
    command: ["celery", "-A", "tasks.celery_app:celery_app", "worker", "-Q", "documents", "--concurrency=2", "--loglevel=INFO", "-n", "documents@%h", "--max-tasks-per-child=50"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app:celery_app inspect ping -d documents@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    image: claimos-frontend:dev
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["${HTTP_PORT:-8080}:80"]
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
  clamav-data:
