# Production edge proxy (Phase 13): TLS termination, HTTP->HTTPS redirect, security headers.
# Certificates are mounted at /etc/nginx/tls/{fullchain.pem,privkey.pem} (see docker-compose.prod.yml).
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  # Query strings are excluded from access logs: they may contain search terms with personal data.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  client_max_body_size 30m;
  client_body_timeout 30s;

  # Use a client/proxy supplied request id only if present; the API re-validates its format.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_req_status 429;

  # Re-resolve service names through Docker's DNS so recreated containers (new IPs)
  # are picked up without restarting Nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $req_id;

  server {
    listen 80;
    server_name _;
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok
";
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok
";
    }

    # Never expose the metrics endpoint at the edge (Prometheus scrapes api:8000 directly).
    location = /metrics {
      return 404;
    }

    location ~ ^/api/v1/workflow-executions/[^/]+/events$ {
      limit_req zone=api_per_ip burst=40 nodelay;
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_read_timeout 60s;
    }

    location / {
      set $web_upstream http://frontend:3000;
      proxy_pass $web_upstream;
      proxy_read_timeout 60s;
    }
  }
}
