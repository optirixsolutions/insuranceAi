# Development edge proxy. TLS termination and production hardening are added in Phase 13.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  # Query strings are excluded from access logs: they may contain search terms with personal data.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  client_max_body_size 30m;
  client_body_timeout 30s;

  # Use a client/proxy supplied request id only if present; the API re-validates its format.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_req_status 429;

  # Re-resolve service names through Docker's DNS so recreated containers (new IPs)
  # are picked up without restarting Nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $req_id;

  server {
    listen 80;
    server_name _;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Server-sent workflow events: no buffering, long-lived (the API sends a keep-alive every 15 s).
    location ~ ^/api/v1/workflow-executions/[^/]+/events$ {
      limit_req zone=api_per_ip burst=40 nodelay;
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_read_timeout 60s;
    }

    location / {
      set $web_upstream http://frontend:3000;
      proxy_pass $web_upstream;
      proxy_read_timeout 60s;
    }
  }
}
