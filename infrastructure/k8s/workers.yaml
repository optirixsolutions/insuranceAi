apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-system
  labels: { app.kubernetes.io/name: worker-system, app.kubernetes.io/component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: worker-system }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker-system, app.kubernetes.io/component: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker-system
          image: claimos-backend
          command: ["celery", "-A", "tasks.celery_app:celery_app", "worker", "-Q", "system", "--concurrency=2", "--loglevel=INFO", "-n", "system@$(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            - configMapRef: { name: claimos-config }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
      volumes:
        - name: secrets
          secret: { secretName: claimos-secrets, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
