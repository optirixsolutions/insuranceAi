apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  labels: { app.kubernetes.io/name: beat, app.kubernetes.io/component: scheduler }
spec:
  replicas: 1
  strategy: { type: Recreate } # never two schedulers
  selector:
    matchLabels: { app.kubernetes.io/name: beat }
  template:
    metadata:
      labels: { app.kubernetes.io/name: beat, app.kubernetes.io/component: scheduler }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: beat
          image: claimos-backend
          command: ["celery", "-A", "tasks.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef: { name: claimos-config }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "500m", memory: 512Mi }
      volumes:
        - name: secrets
          secret: { secretName: claimos-secrets, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  labels: { app.kubernetes.io/name: clamav }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clamav }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clamav }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: clamav
          image: clamav/clamav:1.4
          ports:
            - { name: clamd, containerPort: 3310 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, SETGID, SETUID] }
          readinessProbe:
            tcpSocket: { port: clamd }
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 1536Mi }
            limits: { cpu: "1", memory: 3Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector: { app.kubernetes.io/name: clamav }
  ports:
    - { name: clamd, port: 3310, targetPort: clamd }
