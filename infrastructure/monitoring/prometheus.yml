# Prometheus for ClaimOS (Phase 13). Scrapes the API's /metrics on the internal network only.
# If METRICS_TOKEN is set on the API, mount it at /etc/prometheus/metrics_token (see docker-compose.prod.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: claimos-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
